	const pointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
	const intro = { start: 400, stagger: 60, duration: 2000, fade: 600, flood: 1000, lead: 1375 };
	let logo;
	let glyphs = [];
	let current = 'home';
	let hovering = false;

	sizeCanvas();
	window.addEventListener('resize', sizeCanvas);

	renderRows(panels.press, press, item => item.outlet + ', ' + item.year);
	tabs.addEventListener('click', event => {
		const tab = event.target.closest('.tab');

		if (tab) {
			show(tab.dataset.view);
		}
	});

	if (pointer) {
		container.addEventListener('mouseenter', ripple);
		container.addEventListener('mousemove', ripple);
		container.addEventListener('mouseleave', calm);
	}

	function renderRows(panel, items, meta) {
		items.forEach(item => {
			const row = document.createElement(item.url ? 'a' : 'div');
			const title = document.createElement('span');
			const detail = document.createElement('span');

			if (item.url) {
				row.href = item.url;
				row.target = '_blank';
			}

			row.className = 'row';
			title.className = 'row-title';
			detail.className = 'row-meta';
			title.textContent = item.title;
			detail.textContent = meta(item);
			row.append(title, detail);
			panel.append(row);
		});
	}

	function loadProduction() {
		if (panels.productions.children.length) {
			return;
		}

		productions.forEach(track => {
			const cell = document.createElement('div');
			const frame = document.createElement('iframe');
			const id = track.spotify.split('/track/').pop().split('?')[0];

			cell.className = 'cell';
			frame.title = track.title;
			frame.loading = 'lazy';
			frame.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
			frame.src = 'https://open.spotify.com/embed/track/' + id + '?theme=0';
			frame.addEventListener('load', () => frame.classList.add('loaded'), { once: true });
			cell.append(frame);
			panels.productions.append(cell);
		});
	}

	function show(view) {
		if (view === current) {
			return;
		}

		current = view;

		if (view === 'productions') {
			loadProduction();
		}

		tabs.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('tab-active', tab.dataset.view === view));
		Object.keys(panels).forEach(name => panels[name].classList.toggle('open', name === view));
		container.classList.toggle('hidden', view !== 'home');
	}

	function sizeCanvas() {
		const mobile = window.matchMedia('(max-width: 768px) and (pointer: coarse)').matches;
		zoom.style.zoom = mobile ? '' : window.innerWidth / 2560;
	}

	window.onload = () => {
		logo = generateRandomPicture(logos);
		if (document.hidden) {
			document.addEventListener('visibilitychange', function onShow() {
				if (!document.hidden) {
					document.removeEventListener('visibilitychange', onShow);
					startFade();
				}
			});
		} else {
			startFade();
		}
	};

	function startFade() {
		if (parseFloat(getComputedStyle(document.body).opacity) < 1) {
			document.body.classList.add('fade-in');
		}
		drawLogo();
	}

	function drawLogo() {
		if (!logo || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
			footer.classList.add('shown');
			tabs.classList.add('shown');
			return;
		}

		glyphs = [...logo.querySelectorAll('path')].map(path => {
			const box = path.getBBox();
			return { path: path, x: box.x, y: box.y + box.height / 2, height: box.height };
		});

		const tolerance = glyphs.reduce((total, glyph) => total + glyph.height, 0) / glyphs.length / 2;

		glyphs.sort((a, b) => Math.abs(a.y - b.y) > tolerance ? a.y - b.y : a.x - b.x);
		glyphs.forEach((glyph, index) => {
			glyph.path.style.setProperty('--length', glyph.path.getTotalLength());
			glyph.path.style.setProperty('--phase', index * 45 + 'ms');
		});

		stage.style.setProperty('--fill-at', schedule(intro) + 'ms');
		footer.classList.add('shown');
		tabs.classList.add('shown');
		logo.classList.add('drawing');
		logo.addEventListener('animationend', event => {
			if (event.animationName === 'flood') {
				settle();
			}
		});
	}

	function schedule(timing) {
		const fillAt = timing.start + (glyphs.length - 1) * timing.stagger + timing.duration - timing.lead;

		glyphs.forEach((glyph, index) => {
			const delay = timing.start + index * timing.stagger;

			glyph.path.style.animationDuration = [timing.duration, timing.fade, timing.flood].join('ms, ') + 'ms';
			glyph.path.style.animationDelay = [delay, delay, fillAt].join('ms, ') + 'ms';
		});

		return fillAt;
	}

	function settle() {
		if (!logo.classList.contains('drawing')) {
			return;
		}

		glyphs.forEach(glyph => {
			glyph.path.style.animationDuration = '';
			glyph.path.style.animationDelay = '';
		});

		logo.classList.remove('drawing');
		logo.classList.add('settled');

		if (pointer && container.matches(':hover')) {
			ripple();
		}

		loadProduction();
	}

	function ripple() {
		if (hovering || !logo.classList.contains('settled')) {
			return;
		}

		hovering = true;
		logo.classList.remove('wave');
		logo.getBoundingClientRect();
		logo.classList.add('wave');
	}

	function calm() {
		hovering = false;

		const running = lifts();
		let pending = running.length;

		if (!pending) {
			logo.classList.remove('wave');
			return;
		}

		const lead = running[0];
		const sweeps = Math.max(1, Math.ceil(lead.currentTime / lead.effect.getTiming().duration));

		running.forEach(animation => {
			animation.effect.updateTiming({ iterations: sweeps });
			animation.addEventListener('finish', () => {
				pending -= 1;

				if (!pending) {
					logo.classList.remove('wave');
				}
			}, { once: true });
		});
	}

	function lifts() {
		return glyphs.map(glyph => glyph.path.getAnimations().find(animation => animation.animationName === 'lift')).filter(Boolean);
	}

	function generateRandomPicture(array) {
		let randomNum = Math.floor(Math.random() * logos.length);
		logos[randomNum].style.display = "block";
		return logos[randomNum];
	}
</script>
